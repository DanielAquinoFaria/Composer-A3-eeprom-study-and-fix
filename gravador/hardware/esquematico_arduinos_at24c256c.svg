<text x="60" y="1216" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#172B40" font-weight="700">WP alto: gravação bloqueada. WP baixo: gravação permitida. A leitura funciona nos dois estados.</text>
<text x="60" y="1253" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#4F6376">R3 mantém a proteção no reset. D7 libera cada escrita. Não substitua R3 por um capacitor.</text>
<text x="60" y="1290" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#4F6376">Símbolo funcional, não vista física do CI. Veja MONTAGEM.md para orientação, componentes e sequência de uso.</text>
